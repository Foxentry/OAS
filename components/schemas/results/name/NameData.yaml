type: object
properties:
  nameSurname:
    type:
      - string
      - "null"
    description: Name and surname together.
    example: Petr Novák
  name:
    type:
      - string
      - "null"
    description: First name.
    example: Petr
  surname:
    type:
      - string
      - "null"
    description: Last name / family name.
    example: Novák
  context:
    type: array
    items:
      type: string
      description: Context for name and Surname.
      example: ml.
  degreesBefore:
    type:
      - array
      - "null"
    items:
      type: string
      description: Degrees before name.
      example: Ing.
  degreesAfter:
    type:
      - array
      - "null"
    items:
      type: string
      description: Degrees after name.
      example: Ph.D.
  vocativeName:
    type:
      - string
      - "null"
    description: Vocative form of first name.
    example: Petře
  vocativeSurname:
    type:
      - string
      - "null"
    description: Vocative form of surname.
    example: Nováku
  vocativeNameSurname:
    type:
      - string
      - "null"
    description: Vocative form of name and surname together.
    example: Petře Nováku
  details:
    $ref: ./NameDetails.yaml

required:
  - nameSurname
  - name
  - surname
  - context
  - degreesBefore
  - degreesAfter
